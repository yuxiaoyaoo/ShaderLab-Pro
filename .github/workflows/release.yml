name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis,msi
            targets: ''
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            targets: x86_64-apple-darwin
          - platform: macos-14
            args: --target aarch64-apple-darwin --bundles app,dmg
            targets: aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: --bundles appimage,deb,rpm
            targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: matrix.targets != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
          sudo apt-get install -y libssl-dev zlib1g-dev libayatana-appindicator3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run verify:release-version

      - name: Verify product messages
        run: npm run verify:product-messages

      - name: Build & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新签名私钥（发布产物签名用，见 src-tauri/README 说明）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Windows 代码签名（可选，未提供则跳过签名）
          TAURI_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.TAURI_WINDOWS_CERTIFICATE_THUMBPRINT }}
          # macOS 签名与公证（可选，未提供则不签名/不公证）
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ShaderLab Pro ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          # 保持草稿用于人工核验签名与 latest.json；核验后必须发布，/releases/latest 不会返回草稿。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # 生成 latest.json 作为自动更新端点（静态清单）
          includeUpdaterJson: true
          updaterJsonPreferNsis: true